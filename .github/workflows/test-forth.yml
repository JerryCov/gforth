name: Test Forth Scripts

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install gforth
        run: sudo apt-get update && sudo apt-get install -y gforth

      - name: Run all Forth scripts
        run: |
          for f in *.fs; do
            if [ "$f" = "floatingpointmath.fs" ]; then
              echo "=== Skipping $f (requires random.fs, kept out of the repo as third-party GNU content) ==="
              continue
            fi
            echo "=== Running $f ==="
            gforth "./$f" -e bye
          done
